name: CI

on:
  pull_request:
  push:
    branches: [main, feat/ui-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests, build and bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle

  e2e:
    name: End-to-end (real API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_DIR: ${{ github.workspace }}/api
      E2E_DATABASE_URL: postgresql://ci:ci@localhost:5432/pague50_e2e_test
    steps:
      - name: API repository access
        id: access
        env:
          TOKEN: ${{ secrets.API_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Secret API_REPO_TOKEN is not set: the API repository is private, so the e2e suite was skipped. Add a fine-grained token with read access to augustosnk12/pague-os-50-centavos."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.enabled == 'true'

      # Same branch name in the API repo when it exists (feature pairs), else main.
      - name: Pick API ref
        if: steps.access.outputs.enabled == 'true'
        id: apiref
        env:
          TOKEN: ${{ secrets.API_REPO_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/augustosnk12/pague-os-50-centavos.git" "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.access.outputs.enabled == 'true'
        with:
          repository: augustosnk12/pague-os-50-centavos
          ref: ${{ steps.apiref.outputs.ref }}
          token: ${{ secrets.API_REPO_TOKEN }}
          path: api

      - uses: actions/setup-node@v4
        if: steps.access.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install
        if: steps.access.outputs.enabled == 'true'
        run: |
          npm ci
          (cd api && npm ci && npx prisma generate)
          npx playwright install --with-deps chromium

      - name: Playwright
        if: steps.access.outputs.enabled == 'true'
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: always() && steps.access.outputs.enabled == 'true'
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
