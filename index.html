<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Controle de quem te deve: devedores, cobranças e parcelas." />
    <!-- Status bar color: follows the app theme (script below, then ThemeContext): light #faf9fe / dark #0d0b13. -->
    <meta name="theme-color" content="#faf9fe" />
    <!-- Installed on iPhone ("Adicionar à Tela de Início"): fullscreen, own name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="50 centavos" />
    <title>Pague os 50 centavos</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Saved theme before the first paint: the opening screen and the status
      // bar already have the right colors (ThemeContext takes over after).
      try {
        if (localStorage.getItem('lt-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d0b13')
        }
      } catch (e) {}
    </script>
    <style>
      /* Opening screen of the installed app (main.tsx removes it). The website shows no splash. */
      #lt-splash { display: none; }
      @media (display-mode: standalone), (display-mode: fullscreen) {
        #lt-splash {
          position: fixed; inset: 0; z-index: 1000;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
          padding: 0 40px env(safe-area-inset-bottom);
          background: #faf9fe; color: #1b1825;
          font-family: Manrope, system-ui, -apple-system, sans-serif; text-align: center;
          transition: opacity 200ms ease-in;
        }
      }
      [data-theme="dark"] #lt-splash { background: #0d0b13; color: #f5f4f9; }
      #lt-splash[data-leaving] { opacity: 0; }
      #lt-splash img { width: 104px; height: 104px; display: block; }
      #lt-splash .name { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
      #lt-splash .tag { margin: 6px 0 0; font-size: 14px; font-weight: 500; color: #696774; }
      #lt-splash .ver { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); margin: 0; font-size: 12px; font-weight: 600; color: #696774; }
      [data-theme="dark"] #lt-splash .tag, [data-theme="dark"] #lt-splash .ver { color: #b8b5c2; }
      #lt-splash .bar { width: 120px; height: 4px; border-radius: 999px; background: #e6e2f0; overflow: hidden; }
      [data-theme="dark"] #lt-splash .bar { background: #393545; }
      #lt-splash .bar i { display: block; width: 45%; height: 100%; border-radius: 999px; background: #7544cd; animation: ltSplashBar 1.1s ease-in-out infinite; }
      [data-theme="dark"] #lt-splash .bar i { background: #b085ff; }
      @keyframes ltSplashBar { from { transform: translateX(-100%); } to { transform: translateX(225%); } }
      @media (prefers-reduced-motion: reduce) { #lt-splash .bar i { animation: none; transform: translateX(60%); } }
    </style>
  </head>
  <body>
    <div id="lt-splash" aria-hidden="true">
      <img src="/icon-192.png" alt="" width="104" height="104" />
      <div>
        <p class="name">Pague os 50 centavos</p>
        <p class="tag">Controle de quem te deve</p>
      </div>
      <div class="bar"><i></i></div>
      <p class="ver">v%APP_VERSION%</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
